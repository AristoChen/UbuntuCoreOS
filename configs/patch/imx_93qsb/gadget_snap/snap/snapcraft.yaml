parts:
  u-boot:
    override-build: |
      cat << EOF >> configs/__BOOTLOADER_DEFCONFIG__
      CONFIG_FIT=y
      CONFIG_LOCALVERSION_AUTO=n
      CONFIG_CMD_IMPORTENV=y
      CONFIG_CMD_EXPORTENV=y
      CONFIG_SYS_BOOTM_LEN=0x8000000
      EOF

      # Tianocore EDK II's standalone management mode driver needs to be enabled
      # for this, so temporarily disable first, other wise it will show the
      # following error: Cannot initialize UEFI sub-system, r = 3
      sed -i '/CONFIG_EFI_MM_COMM_TEE=y/d' configs/__BOOTLOADER_DEFCONFIG__

      make __BOOTLOADER_DEFCONFIG__
      make -j$(nproc)

      cp u-boot.bin "${CRAFT_PART_INSTALL}"
      cp spl/u-boot-spl.bin "${CRAFT_PART_INSTALL}"

      # copy tools/mkimage tool for imx-boot stage
      cp tools/mkimage "${CRAFT_PART_INSTALL}"
      # Copy licenses
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/doc/u-boot"
      cp -a Licenses/* "${CRAFT_PART_INSTALL}/usr/share/doc/u-boot"

      if [ '__BOOT_PROCESS__' == 'U-Boot' ]; then
        mkenvimage -s 4096 -o "${CRAFT_PART_INSTALL}"/boot.sel - < /dev/null
        touch "${CRAFT_PART_INSTALL}"/uboot.conf
      fi
    prime:
      - -u-boot.bin
      - -u-boot-spl.bin
      - -imx-boot-tools
      - -mkimage

  optee-os:
    plugin: nil
    source: https://github.com/nxp-imx/imx-optee-os.git
    source-type: git
    source-branch: __BSP_GIT_BRANCH__
    source-depth: 1
    build-environment:
      - ARCH: "arm"
      - CFG_USER_TA_TARGETS: "ta_arm64"
      - CFG_ARM64_core: y
      - DEBUG: 0
      - CFG_TEE_CORE_LOG_LEVEL: 1
      - CFG_TEE_TA_LOG_LEVEL: 1
      - CFG_TEE_BENCHMARK: n
      - CFG_CORE_HEAP_SIZE: 262144
      - CFG_CORE_HUK_SUBKEY_COMPAT_USE_OTP_DIE_ID: n
      - PLATFORM: "imx"
      - PLATFORM_FLAVOR: "mx93evk"
      - on amd64:
          - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET}-"
          - CROSS_COMPILE_core: "${CRAFT_ARCH_TRIPLET}-"
          - CROSS_COMPILE_ta_arm64: "${CRAFT_ARCH_TRIPLET}-"
    override-build: |
      make O="${CRAFT_PART_BUILD}/out" -j$(nproc)
      cp -l ${CRAFT_PART_BUILD}/out/core/tee-raw.bin ${CRAFT_PART_INSTALL}/tee.bin

      # Copy licenses
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/doc/optee-os"
      cp LICENSE "${CRAFT_PART_INSTALL}/usr/share/doc/optee-os"
    prime:
      - -tee*

  imx-firmware:
    plugin: nil
    override-pull: |
      # latest firmware version can be found in
      # https://github.com/nxp-imx/meta-imx/ -b <relevant release> in SCR-<release version>.txt
      firmware_repo="https://github.com/nxp-imx/meta-imx/"
      firmware_branch=$(git ls-remote "${firmware_repo}" |\
        grep "$(echo __BSP_GIT_BRANCH__ | cut -c 4-)" | sed -n 's/.*heads\/\(.*\)/\1/p')
      git clone "${firmware_repo}" -b "${firmware_branch}" --depth 1
      SCR_file=$(find meta-imx -name "SCR*.txt")
      firmware_name=$(grep -r "firmware-imx.*.bin" "${SCR_file}" | sed -n 's/Package: *\(.*\)/\1/p')
      wget "https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/${firmware_name}" \
        -O firmware-imx.bin
    override-build: |
      chmod +x firmware-imx.bin
      ./firmware-imx.bin --force --auto-accept
      cp -r firmware-imx-*/firmware "${CRAFT_PART_INSTALL}"
    prime:
      - -*

  imx-firmware-ele:
    plugin: nil
    override-pull: |
      # latest firmware version can be found in
      # https://github.com/nxp-imx/meta-imx/ -b <relevant release> in SCR-<release version>.txt
      firmware_repo="https://github.com/nxp-imx/meta-imx/"
      firmware_branch=$(git ls-remote "${firmware_repo}" |\
        grep "$(echo __BSP_GIT_BRANCH__ | cut -c 4-)" | sed -n 's/.*heads\/\(.*\)/\1/p')
      git clone "${firmware_repo}" -b "${firmware_branch}" --depth 1
      SCR_file=$(find meta-imx -name "SCR*.txt")
      firmware_name=$(grep -r "firmware-ele-imx.*.bin" "${SCR_file}" | sed -n 's/Package: *\(.*\)/\1/p')
      wget "https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/${firmware_name}" \
        -O firmware-ele-imx.bin
    override-build: |
      chmod +x firmware-ele-imx.bin
      ./firmware-ele-imx.bin --force --auto-accept
      cp -r firmware-ele-imx-*/* "${CRAFT_PART_INSTALL}"
    prime:
      - -*

  arm-trusted-firmware:
    plugin: nil
    source: https://github.com/nxp-imx/imx-atf.git
    source-type: git
    source-depth: 1
    source-branch: __BSP_GIT_BRANCH__
    build-environment:
      - on amd64:
          - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET}-"
    override-build: |
      platform="imx93"
      make \
        PLAT="${platform}" \
        BUILD_BASE="${CRAFT_PART_BUILD}/build" \
        bl31 \
        -j$(nproc)
      make \
        PLAT="${platform}" \
        BUILD_BASE="${CRAFT_PART_BUILD}/build-optee" \
        SPD=opteed \
        bl31 \
        -j$(nproc)
      cp "${CRAFT_PART_BUILD}/build/${platform}/release/bl31.bin" \
         "${CRAFT_PART_INSTALL}/bl31-${platform}.bin"
      cp "${CRAFT_PART_BUILD}/build-optee/${platform}/release/bl31.bin" \
         "${CRAFT_PART_INSTALL}/bl31-${platform}.bin-optee"
    prime:
      - -bl31*

  imx-boot:
    after:
      - arm-trusted-firmware
      - imx-firmware
      - imx-firmware-ele
      - u-boot
      - optee-os
    plugin: nil
    source: https://github.com/nxp-imx/imx-mkimage.git
    source-type: git
    source-branch: __BSP_GIT_BRANCH__
    source-depth: 1
    override-build: |
      platform="imx93"
      # firmware files
      ddr_firmware_list=()
      ddr_firmware_list+=('lpddr4_imem_1d_v202201.bin')
      ddr_firmware_list+=('lpddr4_dmem_1d_v202201.bin')
      ddr_firmware_list+=('lpddr4_imem_2d_v202201.bin')
      ddr_firmware_list+=('lpddr4_dmem_2d_v202201.bin')
      for ddr_firmware in "${ddr_firmware_list[@]}" ; do
        cp "${CRAFT_STAGE}/firmware/ddr/synopsys/${ddr_firmware}" iMX93
      done
      # atf
      cp "${CRAFT_STAGE}/bl31-${platform}.bin-optee" iMX93/bl31.bin
      # optee
      cp "${CRAFT_STAGE}/tee.bin" iMX93/tee.bin
      # u-boot
      cp "${CRAFT_STAGE}/u-boot.bin" iMX93
      cp "${CRAFT_STAGE}/u-boot-spl.bin" iMX93
      # ele firmware
      cp ${CRAFT_STAGE}/mx93a1-ahab-container.img iMX93
      make SOC=iMX9 REV=A1 TEE=tee.bin dtbs=imx93-9x9-qsb.dtb flash_singleboot
      mkdir -p "${CRAFT_PART_INSTALL}/boot_firmware"
      cp iMX93/flash.bin "${CRAFT_PART_INSTALL}/bootloader.bin"

build-packages:
  - zlib1g-dev

